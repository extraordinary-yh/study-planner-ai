source: Synthetic regression scenario
coding:
  implementation: 'Use your working Python approach. For binary search, low < high
    is welcome: explain the invariant, shrinking interval, termination and edge cases.
    No forced alternative template.'
  priorities:
  - topic: topological_sort
    reason: Synthetic learner needs practice in topological_sort
    source: Synthetic test fixture
    resolved_on: null
    problems:
    - slug: course-schedule
      title: Course Schedule
      difficulty: medium
      pattern: Topological sort / directed-cycle detection; Kahn BFS or DFS is acceptable
    - slug: course-schedule-ii
      title: Course Schedule II
      difficulty: medium
      pattern: Produce a topological ordering; transfer check after Course Schedule
  - topic: tries
    reason: Synthetic learner needs practice in tries
    source: Synthetic test fixture
    resolved_on: null
