resources:
  primer:
    label: System Design Primer
    url: https://github.com/donnemartin/system-design-primer#index-of-system-design-topics
  hello:
    label: Hello Interview — Introduction (orientation)
    url: https://www.hellointerview.com/learn/system-design/in-a-hurry/introduction
  hello_delivery:
    label: Hello Interview — Delivery Framework (required)
    url: https://www.hellointerview.com/learn/system-design/in-a-hurry/delivery
  ddia: https://dataintensive.net/
  bbg: https://bytebytego.com/courses/system-design-interview/foreword
  sre: https://sre.google/sre-book/table-of-contents/
  Temporal docs: https://docs.temporal.io/workflows
  Anthropic 'Building effective agents': https://www.anthropic.com/research/building-effective-agents
  Statsig docs: https://docs.statsig.com/feature-flags/overview
modules:
- id: m1
  title: Fundamentals and the interview format
  lessons:
  - id: m1l1
    title: What a system-design interview actually tests
    minutes: 45
    start_resource: hello_delivery
    read: 'hello_delivery: Delivery Framework (required); hello: Introduction (orientation);
      primer: reference only, ''How to approach a system design interview question'''
    do: Use a fictional task-management app to explain what a system-design interview
      actually tests. Draw one design, one tradeoff, and one failure case.
  - id: m1l2
    title: Back-of-envelope estimation
    minutes: 60
    read: 'primer: ''Powers of two table'' and ''Latency numbers every programmer
      should know''; bbg ch. 2'
    do: Use a fictional task-management app to explain back-of-envelope estimation.
      Draw one design, one tradeoff, and one failure case.
  - id: m1l3
    title: Requirements and API design
    minutes: 45
    read: 'hello: core concepts (functional vs non-functional requirements); primer:
      ''REST vs RPC'''
    do: Use a fictional task-management app to explain requirements and api design.
      Draw one design, one tradeoff, and one failure case.
  - id: m1l4
    title: Applied foundations before deep-dive probes
    minutes: 90
    read: 'primer: the relevant core concepts; use the exercise to explain your reasoning'
    do: Use a fictional task-management app to explain applied foundations before
      deep-dive probes. Draw one design, one tradeoff, and one failure case.
- id: m2
  title: Storage
  lessons:
  - id: m2l1
    title: Relational vs document vs key-value; indexes
    minutes: 60
    read: 'ddia ch. 2–3 (data models, storage engines); primer: ''Database'''
    do: Use a fictional task-management app to explain relational vs document vs key-value;
      indexes. Draw one design, one tradeoff, and one failure case.
  - id: m2l2
    title: Replication and consistency
    minutes: 60
    read: 'ddia ch. 5 (replication) and ch. 9 first half (linearizability); hello:
      consistency patterns'
    do: Use a fictional task-management app to explain replication and consistency.
      Draw one design, one tradeoff, and one failure case.
  - id: m2l3
    title: Partitioning / sharding
    minutes: 60
    read: 'ddia ch. 6; primer: ''Sharding'' and ''Federation'''
    do: Use a fictional task-management app to explain partitioning / sharding. Draw
      one design, one tradeoff, and one failure case.
  - id: m2l4
    title: Caching
    minutes: 45
    read: 'primer: ''Cache'' (all patterns) ; bbg ch. 1 cache section'
    do: Use a fictional task-management app to explain caching. Draw one design, one
      tradeoff, and one failure case.
  - id: m2l5
    title: Object storage and CDNs
    minutes: 30
    read: 'primer: ''Content delivery network''; any GCS/S3 signed-URL doc'
    do: Use a fictional task-management app to explain object storage and cdns. Draw
      one design, one tradeoff, and one failure case.
- id: m3
  title: Scaling the request path
  lessons:
  - id: m3l1
    title: Load balancing, stateless services, horizontal scaling
    minutes: 45
    read: 'primer: ''Load balancer'', ''Reverse proxy'', ''Application layer'''
    do: Use a fictional task-management app to explain load balancing, stateless services,
      horizontal scaling. Draw one design, one tradeoff, and one failure case.
  - id: m3l2
    title: Rate limiting and admission control
    minutes: 45
    read: 'bbg ch. 4 (rate limiter); hello: rate limiter pattern'
    do: Use a fictional task-management app to explain rate limiting and admission
      control. Draw one design, one tradeoff, and one failure case.
  - id: m3l3
    title: 'Asynchronous work: queues, workers, idempotency'
    minutes: 60
    read: 'primer: ''Asynchronism'' and ''Message queues''; ddia ch. 11 first half'
    do: 'Use a fictional task-management app to explain asynchronous work: queues,
      workers, idempotency. Draw one design, one tradeoff, and one failure case.'
  - id: m3l4
    title: Durable workflows (Temporal) vs hand-rolled state machines
    minutes: 60
    read: 'Temporal docs: ''What is a workflow'' and ''Activities, retries, heartbeats'''
    do: Use a fictional task-management app to explain durable workflows (temporal)
      vs hand-rolled state machines. Draw one design, one tradeoff, and one failure
      case.
- id: m4
  title: Communication and real-time
  lessons:
  - id: m4l1
    title: Polling, long polling, SSE, WebSockets
    minutes: 45
    read: 'primer: ''Communication''; hello: real-time updates pattern'
    do: Use a fictional task-management app to explain polling, long polling, sse,
      websockets. Draw one design, one tradeoff, and one failure case.
  - id: m4l2
    title: API gateways, gRPC, GraphQL, versioning
    minutes: 30
    read: 'primer: ''REST vs RPC''; any gRPC intro'
    do: Use a fictional task-management app to explain api gateways, grpc, graphql,
      versioning. Draw one design, one tradeoff, and one failure case.
- id: m5
  title: Reliability and operations
  lessons:
  - id: m5l1
    title: 'Failure modes: timeouts, retries, circuit breakers, bulkheads'
    minutes: 60
    read: 'sre ch. 22 (cascading failures); primer: ''Availability patterns'''
    do: 'Use a fictional task-management app to explain failure modes: timeouts, retries,
      circuit breakers, bulkheads. Draw one design, one tradeoff, and one failure
      case.'
  - id: m5l2
    title: Observability, SLOs, rollouts, feature flags
    minutes: 45
    read: 'sre ch. 4 (SLOs) and ch. 6 (monitoring); Statsig docs: gates vs experiments'
    do: Use a fictional task-management app to explain observability, slos, rollouts,
      feature flags. Draw one design, one tradeoff, and one failure case.
  - id: m5l3
    title: Multi-vendor pipelines and graceful degradation
    minutes: 45
    read: 'primer: review core concepts, then apply them to a fictional project'
    do: Use a fictional task-management app to explain multi-vendor pipelines and
      graceful degradation. Draw one design, one tradeoff, and one failure case.
